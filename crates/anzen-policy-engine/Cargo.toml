[package]
name = "anzen-policy-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bip39 = "2.2"
bitcoin = { version = "0.32.9", features = ["base64", "serde"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
miniscript = { version = "12.3.5", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = "1.8"
