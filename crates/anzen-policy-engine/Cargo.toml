[package]
name = "anzen-policy-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
bip39 = "2.2"
bitcoin = { version = "0.32.9", features = ["base64", "serde"] }
miniscript = { version = "12.3.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = "1.8"
