[package]
name = "anzen-prime-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anzen-cold-signer = { path = "../../vendor/anzen-cold-signer" }
anzen-policy-engine = { path = "../anzen-policy-engine" }
bitcoin = "0.32.9"
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }
sha2 = "0.10"
zeroize = "1.8"

[dev-dependencies]
pgp = { version = "=0.17.0", default-features = false }
rand = "0.8"
serde_json = "1.0"
